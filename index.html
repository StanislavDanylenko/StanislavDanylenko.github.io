<!doctype html>
<html lang="en" class="bg-slate-950">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stanislav Danylenko</title>
    <meta name="description" content="I am Stanislav Danylenko - Senior FullStack Developer, and this is my personal page with summary, language, education, interests, articles, skills, achievements and work experience info.">

    <script src="js/vendor/tailwind.min.js"></script>
    <script defer src="js/vendor/alpine.min.js"></script>
    <link rel="stylesheet" href="css/vendor/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">

    <link rel="apple-touch-icon" sizes="180x180" href="files/fav/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="files/fav/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="files/fav/favicon-16x16.png">
    <link rel="manifest" href="files/fav/site.webmanifest">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 font-sans text-slate-200 antialiased">

    <!-- MOBILE NAVBAR -->
<div x-data="{ open: false }" class="md:hidden fixed top-0 inset-x-0 z-50">
    <div class="bg-slate-900 border-b border-slate-800 px-4 h-16 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <img src="files/avatar.jpg" class="rounded-full w-8 h-8 border border-slate-700 object-cover" alt="avatar">
            <span class="text-sm font-semibold text-slate-200">S. Danylenko</span>
        </div>
        <button @click="open = !open" class="text-slate-400 hover:text-white p-1" aria-label="Toggle menu">
            <i class="bi bi-list text-2xl" x-show="!open"></i>
            <i class="bi bi-x text-2xl" x-show="open"></i>
        </button>
    </div>
    <nav x-show="open" x-transition class="bg-slate-900 border-b border-slate-800 px-4 py-2 space-y-1">
        <a @click="open=false" href="#section-summary"         class="block px-3 py-2 rounded-lg text-sm text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">summary</a>
        <a @click="open=false" href="#section-main-skills"     class="block px-3 py-2 rounded-lg text-sm text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">main skills</a>
        <a @click="open=false" href="#section-secondary-skills"class="block px-3 py-2 rounded-lg text-sm text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">secondary skills</a>
        <a @click="open=false" href="#section-education"       class="block px-3 py-2 rounded-lg text-sm text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">education</a>
        <a @click="open=false" href="#section-languages"       class="block px-3 py-2 rounded-lg text-sm text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">languages</a>
        <a @click="open=false" href="#section-work-experience" class="block px-3 py-2 rounded-lg text-sm text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">work experience</a>
        <a @click="open=false" href="#section-other-activities"class="block px-3 py-2 rounded-lg text-sm text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">other activities</a>
        <a @click="open=false" href="#section-interests"       class="block px-3 py-2 rounded-lg text-sm text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">interests</a>
        <a @click="open=false" href="#section-android"         class="block px-3 py-2 rounded-lg text-sm text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">android</a>
    </nav>
</div>

    <!-- DESKTOP SIDEBAR -->
<aside class="hidden md:flex fixed inset-y-0 left-0 w-64 bg-slate-900 border-r border-slate-800 flex-col items-center py-8 overflow-y-auto z-40">
    <img src="files/avatar.jpg"
         class="rounded-full w-20 h-20 border-2 border-slate-700 mb-4 object-cover"
         alt="Stanislav's avatar">
    <p class="text-sm font-semibold text-slate-200 mb-6">S. Danylenko</p>
    <nav class="w-full px-3 space-y-1">
        <a href="#section-summary"         class="block px-3 py-2 rounded-lg text-sm text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">summary</a>
        <a href="#section-main-skills"     class="block px-3 py-2 rounded-lg text-sm text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">main skills</a>
        <a href="#section-secondary-skills"class="block px-3 py-2 rounded-lg text-sm text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">secondary skills</a>
        <a href="#section-education"       class="block px-3 py-2 rounded-lg text-sm text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">education</a>
        <a href="#section-languages"       class="block px-3 py-2 rounded-lg text-sm text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">languages</a>
        <a href="#section-work-experience" class="block px-3 py-2 rounded-lg text-sm text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">work experience</a>
        <a href="#section-other-activities"class="block px-3 py-2 rounded-lg text-sm text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">other activities</a>
        <a href="#section-interests"       class="block px-3 py-2 rounded-lg text-sm text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">interests</a>
        <a href="#section-android"         class="block px-3 py-2 rounded-lg text-sm text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">android</a>
    </nav>
</aside>

    <!-- MAIN CONTENT (Tasks 3–9) -->
    <main class="md:ml-64 min-h-screen p-4 pt-20 md:pt-4 space-y-4">
    </main>

    <!-- SCROLL TO TOP -->
<button
    x-data="{ scrolled: false }"
    x-show="scrolled"
    x-transition
    @scroll.window="scrolled = window.scrollY > 300"
    @click="window.scrollTo({ top: 0, behavior: 'smooth' })"
    class="fixed bottom-6 right-6 bg-indigo-600 hover:bg-indigo-500 text-white rounded-full w-10 h-10 flex items-center justify-center transition-colors z-50"
    aria-label="Go to top">
    <i class="bi bi-arrow-up-short text-xl"></i>
</button>

    <!-- SCRIPTS (Task 9) -->

</body>
</html>
